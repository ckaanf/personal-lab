# Cloudflare DNS 인증서용 토큰을 읽는다. 기본 유닛의 --environ은 환경 변수를 로그에 찍으므로 뺀다.
# tailnet 주소에 바인딩하므로 Tailscale이 먼저 떠야 하고, 주소가 늦게 붙으면 다시 시도한다.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
EnvironmentFile=/etc/caddy/cloudflare.env
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
Restart=on-failure
RestartSec=5s
